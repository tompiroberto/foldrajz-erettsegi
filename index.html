<!doctype html>
<html lang="hu" data-mode="topo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E7C86" />
    <meta name="description" content="Topográfia és elmélet – gyakorló app az emelt szintű földrajz érettségire." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="favicon" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Földrajz emelt érettségi</title>
    <script>
      // Set theme before first paint to avoid a light flash in dark mode.
      try {
        var s = JSON.parse(localStorage.getItem('fe-settings') || '{}');
        var t = (s.state && s.state.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (location.pathname.indexOf('/elmelet') === 0) document.documentElement.dataset.mode = 'theory';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
